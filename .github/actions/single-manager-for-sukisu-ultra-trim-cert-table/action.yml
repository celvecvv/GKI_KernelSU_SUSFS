name: 'Single manager for SukiSU-Ultra (trim cert table)'
description: 'Single manager for SukiSU-Ultra (trim cert table) (composite, keeps the workflow to one entry)'
inputs:
  root_flavor:
    description: 'root_flavor'
    required: false

runs:
  using: "composite"
  steps:
    - name: Single manager for SukiSU-Ultra (trim cert table)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        python3 "${GITHUB_WORKSPACE}/.github/scripts/trim_sukisu_managers.py" SukiSU-Ultra

        # Android GKI 6.12 registers hooks with an LSM descriptor.
        if grep -A 1 "extern void security_add_hooks(" common/include/linux/lsm_hooks.h | grep -q "const struct lsm_id"; then
          python3 - <<'PY'
        from pathlib import Path

        source = Path("SukiSU-Ultra/kernel/hook/lsm_hook.c")
        old = '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");'
        new = '''    static const struct lsm_id ksu_lsm_id = {
                .name = "ksu",
                .id = 0,
            };
            security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), &ksu_lsm_id);'''
        text = source.read_text()
        if text.count(old) != 1:
            raise SystemExit("Expected one legacy SukiSU Nova LSM registration")
        source.write_text(text.replace(old, new))
        PY
        fi

        # Reserve static LSM capacity for both out-of-tree registrations.
        if [ -f common/include/linux/lsm_count.h ]; then
          python3 - <<'PY'
        from pathlib import Path
        import re

        path = Path("common/include/linux/lsm_count.h")
        text = path.read_text()
        if "SUKISU_BUILTIN_LSM_ENABLED" in text:
            raise SystemExit("LSM reservation already exists")
        offset = text.index("#define MAX_LSM_COUNT")
        capacity = """/* Built-in Nova and BBG also register LSMs on this GKI branch. */
        #if IS_BUILTIN(CONFIG_KSU)
        #define SUKISU_BUILTIN_LSM_ENABLED 1,
        #else
        #define SUKISU_BUILTIN_LSM_ENABLED
        #endif
        #if IS_ENABLED(CONFIG_BBG)
        #define BASEBAND_GUARD_LSM_ENABLED 1,
        #else
        #define BASEBAND_GUARD_LSM_ENABLED
        #endif

        """
        text = text[:offset] + capacity + text[offset:]
        anchor = re.compile(r"(?m)^(\s*)CAPABILITIES_ENABLED([\t ]*\\)$")
        text, count = anchor.subn(
            lambda m: m.group(1) + "SUKISU_BUILTIN_LSM_ENABLED\t\\\n"
            + m.group(1) + "BASEBAND_GUARD_LSM_ENABLED\t\\\n"
            + m.group(0), text
        )
        if count != 1:
            raise SystemExit("Expected one capability entry in LSM counter")
        path.write_text(text)
        print("Reserved LSM capacity for built-in SukiSU Nova and BBG")
        PY
        fi

        # Limit Nova rescue-key detection to early boot.
        python3 - <<'PY'
        from pathlib import Path
        
        path = Path("SukiSU-Ultra/kernel/runtime/ksud.c")
        text = path.read_text()
        def replace_once(old, new):
            global text
            if text.count(old) != 1:
                raise SystemExit(f"Unexpected safe-mode source anchor: {old[:70]!r}")
            text = text.replace(old, new, 1)
        
        replace_once('    ksu_boot_completed = true;\n    pr_info("on_boot_completed!\\n");',
                     '    WRITE_ONCE(ksu_boot_completed, true);\n    stop_input_hook();\n    pr_info("on_boot_completed!\\n");')
        old = '''bool ksu_is_safe_mode(void)
        {
            // don't need to check again, userspace may call multiple times
            static bool already_checked = false;
            if (already_checked)
                return true;
        
            // stop hook first!
            stop_input_hook();
        
            if (!safe_mode_flag)
                return false;
        
            pr_info("volume keys pressed max times, safe mode detected!\\n");
            already_checked = true;
            return true;
        }'''
        new = '''bool ksu_is_safe_mode(void)
        {
            static bool already_checked = false;
            static bool boot_safe_mode = false;
        
            if (smp_load_acquire(&already_checked))
                return READ_ONCE(boot_safe_mode);
        
            stop_input_hook();
            WRITE_ONCE(boot_safe_mode, READ_ONCE(safe_mode_flag));
            smp_store_release(&already_checked, true);
            if (boot_safe_mode)
                pr_info("volume keys pressed max times, safe mode detected!\\n");
            return boot_safe_mode;
        }'''
        replace_once(old, new)
        replace_once('    if (!value)\n        return;\n\n    if (type != EV_KEY)',
                     '    if (READ_ONCE(ksu_boot_completed) || !READ_ONCE(ksu_input_hook))\n        return;\n\n    if (value != 1)\n        return;\n\n    if (type != EV_KEY)')
        replace_once('static void stop_input_hook(void)\n{',
                     'static DEFINE_MUTEX(ksu_input_stop_lock);\n\nstatic void stop_input_hook(void)\n{\n    mutex_lock(&ksu_input_stop_lock);')
        replace_once('    if (!ksu_input_hook) {\n        return;\n    }\n    ksu_input_hook = false;',
                     '    // Also remove the input handler when SUSFS closed the hook.\n    WRITE_ONCE(ksu_input_hook, false);')
        replace_once('    vol_detector_exit();\n}',
                     '    vol_detector_exit();\n    mutex_unlock(&ksu_input_stop_lock);\n}')
        replace_once('        safe_mode_flag = true;', '        WRITE_ONCE(safe_mode_flag, true);')
        path.write_text(text)
        print("Nova safe-mode detection restricted to early boot, first result cached")
        
        PY
